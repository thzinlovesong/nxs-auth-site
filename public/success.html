<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NXS Inject | Verificado</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      background: #05050a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .banner-bg {
      position: fixed;
      inset: 0;
      background-image: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1920&q=80');
      background-size: cover;
      background-position: center;
      filter: blur(8px) brightness(0.35) saturate(1.2);
      transform: scale(1.1);
      z-index: 0;
    }
    .banner-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 0%, rgba(5,5,10,0.85) 70%, #05050a 100%);
      z-index: 1;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
      filter: blur(40px);
      opacity: 0.6;
      animation: float 12s ease-in-out infinite;
    }
    .orb-1 { width: 300px; height: 300px; background: radial-gradient(circle, #a855f7, transparent 70%); top: 10%; left: 15%; }
    .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, #7c3aed, transparent 70%); bottom: 5%; right: 10%; animation-delay: -4s; }
    .orb-3 { width: 200px; height: 200px; background: radial-gradient(circle, #c084fc, transparent 70%); top: 60%; left: 5%; animation-delay: -8s; }
    .orb-4 { width: 250px; height: 250px; background: radial-gradient(circle, #8b5cf6, transparent 70%); top: 20%; right: 20%; animation-delay: -2s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%      { transform: translate(40px, -30px) scale(1.1); }
      66%      { transform: translate(-30px, 40px) scale(0.95); }
    }

    .card {
      position: relative;
      z-index: 10;
      background: rgba(20, 15, 25, 0.65);
      border: 1px solid rgba(168, 85, 247, 0.5);
      border-radius: 24px;
      padding: 56px 48px;
      max-width: 460px;
      width: 90%;
      text-align: center;
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow:
        0 0 0 1px rgba(168, 85, 247, 0.15),
        0 20px 60px rgba(168, 85, 247, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes cardIn {
      0%   { opacity: 0; transform: translateY(30px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .check {
      width: 96px; height: 96px;
      margin: 0 auto 28px;
      background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 800;
      color: #fff;
      box-shadow:
        0 10px 40px rgba(168, 85, 247, 0.6),
        0 0 60px rgba(168, 85, 247, 0.4);
      position: relative;
      animation: pop 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes pop {
      0%   { transform: scale(0); }
      60%  { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    .check::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid rgba(168, 85, 247, 0.5);
      animation: ring 2s ease-out infinite;
    }
    @keyframes ring {
      0%   { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 14px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 30%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      color: #a0a0b8;
      font-size: 15px;
      line-height: 1.7;
    }
    p strong { color: #c084fc; font-weight: 600; }

    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: #55556a;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .footer span { color: #a855f7; font-weight: 600; }
  </style>
</head>
<body>
  <div class="banner-bg"></div>
  <div class="banner-overlay"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>

  <div class="card">
    <div class="check">✓</div>
    <h1>Verificado!</h1>
    <p>
      Sua conta foi autorizada com sucesso.<br>
      O cargo de verificado já foi aplicado no servidor.<br><br>
      <strong>Pode fechar esta aba e voltar ao Discord.</strong>
    </p>
    <p class="footer">NXS Inject <span>©</span> 2026</p>
  </div>
</body>
</html>
