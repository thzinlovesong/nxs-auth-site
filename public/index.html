<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NXS Inject | Verificação</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      background: #05050a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ===== Banner de fundo ===== */
    .banner-bg {
      position: fixed;
      inset: 0;
      background-image: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1920&q=80');
      background-size: cover;
      background-position: center;
      filter: blur(8px) brightness(0.35) saturate(1.2);
      transform: scale(1.1);
      z-index: 0;
    }
    .banner-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 0%, rgba(5,5,10,0.85) 70%, #05050a 100%);
      z-index: 1;
    }

    /* ===== Bolinhas neon roxas ===== */
    .orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
      filter: blur(40px);
      opacity: 0.6;
      animation: float 12s ease-in-out infinite;
    }
    .orb-1 { width: 300px; height: 300px; background: radial-gradient(circle, #a855f7, transparent 70%); top: 10%; left: 15%; animation-delay: 0s; }
    .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, #7c3aed, transparent 70%); bottom: 5%; right: 10%; animation-delay: -4s; }
    .orb-3 { width: 200px; height: 200px; background: radial-gradient(circle, #c084fc, transparent 70%); top: 60%; left: 5%; animation-delay: -8s; }
    .orb-4 { width: 250px; height: 250px; background: radial-gradient(circle, #8b5cf6, transparent 70%); top: 20%; right: 20%; animation-delay: -2s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%      { transform: translate(40px, -30px) scale(1.1); }
      66%      { transform: translate(-30px, 40px) scale(0.95); }
    }

    /* ===== Partículas ===== */
    .particles { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
    .particle {
      position: absolute;
      width: 4px; height: 4px;
      background: #c084fc;
      border-radius: 50%;
      box-shadow: 0 0 10px #a855f7, 0 0 20px #a855f7;
      animation: rise linear infinite;
      opacity: 0;
    }
    @keyframes rise {
      0%   { transform: translateY(100vh); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }

    /* ===== Card ===== */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(15, 15, 25, 0.65);
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: 24px;
      padding: 56px 48px;
      max-width: 460px;
      width: 90%;
      text-align: center;
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow:
        0 0 0 1px rgba(168, 85, 247, 0.1),
        0 20px 60px rgba(124, 58, 237, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes cardIn {
      0%   { opacity: 0; transform: translateY(30px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #a855f7, transparent);
      border-radius: 50%;
    }

    /* ===== Logo (usa logo.png da mesma pasta) ===== */
    .logo-wrapper {
      width: 110px; height: 110px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .logo-wrapper::after {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.5), transparent 70%);
      filter: blur(20px);
      z-index: -1;
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50%      { opacity: 1; transform: scale(1.08); }
    }
    .logo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.7))
              drop-shadow(0 0 40px rgba(168, 85, 247, 0.4));
      animation: logoFloat 4s ease-in-out infinite;
    }
    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    /* ===== Título ===== */
    h1 {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 30%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand-sub {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #a855f7;
      margin-bottom: 24px;
      opacity: 0.85;
    }

    .sub {
      color: #a0a0b8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 36px;
    }
    .sub strong { color: #c084fc; font-weight: 600; }

    /* ===== Botão ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 18px 24px;
      background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow:
        0 8px 24px rgba(124, 58, 237, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      position: relative;
      overflow: hidden;
    }
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent, rgba(255,255,255,0.2), transparent);
      transform: translateX(-100%);
      transition: transform 0.6s;
    }
    .btn:hover::before { transform: translateX(100%); }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 12px 32px rgba(124, 58, 237, 0.6),
        0 0 40px rgba(168, 85, 247, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    .btn:active { transform: translateY(0); }
    .btn svg { filter: drop-shadow(0 0 6px rgba(255,255,255,0.4)); }

    /* ===== Footer ===== */
    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: #55556a;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .footer span { color: #a855f7; font-weight: 600; }

    /* ===== Erro ===== */
    .error {
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid rgba(220, 38, 38, 0.5);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 24px;
      backdrop-filter: blur(10px);
    }

    @media (max-width: 480px) {
      .card { padding: 40px 28px; border-radius: 20px; }
      h1 { font-size: 24px; }
      .logo-wrapper { width: 88px; height: 88px; }
      .orb-1, .orb-2, .orb-3, .orb-4 { filter: blur(50px); }
    }
  </style>
</head>
<body>
  <div class="banner-bg"></div>
  <div class="banner-overlay"></div>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>

  <div class="particles" id="particles"></div>

  <div class="card">
    <div class="logo-wrapper">
      <img src="logo.png" alt="NXS Inject">
    </div>
    <h1>NXS Inject</h1>
    <span class="brand-sub">Verificação de Acesso</span>

    <p class="sub">
      Para liberar o acesso ao servidor da <strong>NXS Inject</strong>,<br>
      autorize sua conta Discord abaixo.
    </p>

    <div id="error" class="error" style="display:none;"></div>

    <a href="/api/auth" class="btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
      </svg>
      Autorizar com Discord
    </a>

    <p class="footer">NXS Inject <span>©</span> 2026</p>
  </div>

  <script>
    const particlesContainer = document.getElementById('particles');
    const particleCount = 30;

    for (let i = 0; i < particleCount; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (Math.random() * 10 + 8) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      p.style.width = p.style.height = (Math.random() * 3 + 2) + 'px';
      p.style.opacity = Math.random() * 0.7 + 0.3;
      particlesContainer.appendChild(p);
    }

    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    if (error) {
      const errorDiv = document.getElementById('error');
      const messages = {
        no_code: 'Código de autorização não recebido.',
        acesso_negado: 'Você negou a autorização.',
        codigo_invalido: 'Código de autorização inválido.',
        falha_token: 'Falha ao validar sua conta.',
        auth_failed: 'Erro na autenticação. Tente novamente.',
        erro_servidor: 'Erro interno. Tente novamente.',
      };
      errorDiv.textContent = messages[error] || 'Erro desconhecido.';
      errorDiv.style.display = 'block';
    }
  </script>
</body>
</html>
