<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <title>NXS Inject | Verificação</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" href="logo.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root { --purple: #a855f7; --purple-dark: #7c3aed; --purple-light: #c084fc; --bg: #05050a; }
    html, body { height: 100%; overflow-x: hidden; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg); color: #fff;
      min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px; position: relative;
    }
    .banner-bg {
      position: fixed; inset: 0;
      background-image: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1920&q=80');
      background-size: cover; background-position: center;
      filter: blur(10px) brightness(0.3) saturate(1.3);
      transform: scale(1.15); z-index: 0;
    }
    .banner-overlay {
      position: fixed; inset: 0;
      background:
        radial-gradient(circle at 50% 50%, transparent 0%, rgba(5,5,10,0.9) 65%, #05050a 100%),
        linear-gradient(180deg, rgba(124,58,237,0.15) 0%, transparent 50%, rgba(5,5,10,0.7) 100%);
      z-index: 1;
    }
    .orb {
      position: fixed; border-radius: 50%; pointer-events: none; z-index: 2;
      filter: blur(50px); opacity: 0.55; animation: float 14s ease-in-out infinite;
      will-change: transform;
    }
    .orb-1 { width: 280px; height: 280px; background: radial-gradient(circle, #a855f7, transparent 70%); top: 8%; left: 10%; }
    .orb-2 { width: 360px; height: 360px; background: radial-gradient(circle, #7c3aed, transparent 70%); bottom: 8%; right: 8%; animation-delay: -4s; }
    .orb-3 { width: 200px; height: 200px; background: radial-gradient(circle, #c084fc, transparent 70%); top: 60%; left: 3%; animation-delay: -8s; }
    .orb-4 { width: 240px; height: 240px; background: radial-gradient(circle, #8b5cf6, transparent 70%); top: 15%; right: 15%; animation-delay: -2s; }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%      { transform: translate(35px, -25px) scale(1.08); }
      66%      { transform: translate(-25px, 35px) scale(0.95); }
    }
    .particles { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
    .particle {
      position: absolute; background: #c084fc; border-radius: 50%;
      box-shadow: 0 0 8px #a855f7, 0 0 16px #a855f7;
      animation: rise linear infinite; opacity: 0;
    }
    @keyframes rise {
      0%   { transform: translateY(105vh); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }
    .card {
      position: relative; z-index: 10;
      background: rgba(15, 15, 25, 0.72);
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 440px; width: 100%;
      text-align: center;
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow:
        0 0 0 1px rgba(168, 85, 247, 0.08),
        0 24px 64px rgba(124, 58, 237, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes cardIn {
      0%   { opacity: 0; transform: translateY(30px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--purple), transparent);
    }
    .logo-wrapper {
      width: 110px; height: 110px; margin: 0 auto 24px;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .logo-wrapper::after {
      content: ''; position: absolute; inset: -8px; border-radius: 50%;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.5), transparent 70%);
      filter: blur(20px); z-index: -1;
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50%      { opacity: 0.9; transform: scale(1.1); }
    }
    .logo-wrapper img {
      width: 100%; height: 100%; object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.7)) drop-shadow(0 0 40px rgba(168, 85, 247, 0.4));
      animation: logoFloat 4s ease-in-out infinite;
    }
    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    h1 {
      font-size: 32px; font-weight: 900; margin-bottom: 6px; letter-spacing: -1px;
      background: linear-gradient(135deg, #fff 30%, var(--purple-light) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand-sub {
      display: block; font-size: 11px; font-weight: 700;
      letter-spacing: 4px; text-transform: uppercase;
      color: var(--purple); margin-bottom: 26px; opacity: 0.85;
    }
    .sub { color: #a0a0b8; font-size: 15px; line-height: 1.6; margin-bottom: 32px; }
    .sub strong { color: var(--purple-light); font-weight: 600; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%; padding: 18px 24px;
      background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
      color: #fff; border: none; border-radius: 14px;
      font-size: 16px; font-weight: 700; font-family: inherit;
      cursor: pointer; text-decoration: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      position: relative; overflow: hidden;
      -webkit-user-select: none; user-select: none;
    }
    .btn::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, transparent, rgba(255,255,255,0.25), transparent);
      transform: translateX(-100%); transition: transform 0.7s;
    }
    .btn:hover::before, .btn:active::before { transform: translateX(100%); }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(124, 58, 237, 0.6), 0 0 40px rgba(168, 85, 247, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    .btn:active { transform: translateY(0) scale(0.98); }
    .footer { margin-top: 26px; font-size: 11px; color: #55556a; letter-spacing: 1px; text-transform: uppercase; }
    .footer span { color: var(--purple); font-weight: 700; }
    .error {
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid rgba(220, 38, 38, 0.5);
      color: #fca5a5;
      padding: 12px 16px; border-radius: 12px;
      font-size: 13px; margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }
    @media (max-width: 480px) {
      body { padding: 16px; }
      .card { padding: 40px 24px; border-radius: 20px; }
      h1 { font-size: 26px; }
      .brand-sub { font-size: 10px; letter-spacing: 3px; margin-bottom: 20px; }
      .logo-wrapper { width: 90px; height: 90px; margin-bottom: 20px; }
      .sub { font-size: 14px; margin-bottom: 26px; }
      .btn { padding: 16px 20px; font-size: 15px; }
      .orb-1, .orb-2, .orb-3, .orb-4 { filter: blur(60px); }
    }
    @media (max-width: 360px) {
      .card { padding: 32px 20px; }
      h1 { font-size: 22px; }
      .logo-wrapper { width: 76px; height: 76px; }
    }
  </style>
</head>
<body>
  <div class="banner-bg"></div>
  <div class="banner-overlay"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
  <div class="particles" id="particles"></div>

  <div class="card">
    <div class="logo-wrapper">
      <img src="logo.png" alt="NXS Inject">
    </div>
    <h1>NXS Inject</h1>
    <span class="brand-sub">Verificação de Acesso</span>

    <p class="sub">
      Para liberar o acesso ao servidor da <strong>NXS Inject</strong>,<br>
      autorize sua conta Discord abaixo.
    </p>

    <div id="error" class="error" style="display:none;"></div>

    <a href="/api/auth" class="btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
      </svg>
      Autorizar com Discord
    </a>

    <p class="footer">NXS Inject <span>©</span> 2026</p>
  </div>

  <script>
    const particlesContainer = document.getElementById('particles');
    const isMobile = window.innerWidth < 600;
    const particleCount = isMobile ? 18 : 30;

    for (let i = 0; i < particleCount; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 3 + 2;
      p.style.left = Math.random() * 100 + '%';
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.animationDuration = (Math.random() * 10 + 8) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      p.style.opacity = Math.random() * 0.7 + 0.3;
      particlesContainer.appendChild(p);
    }

    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    if (error) {
      const errorDiv = document.getElementById('error');
      const messages = {
        no_code: 'Código de autorização não recebido.',
        acesso_negado: 'Você negou a autorização.',
        codigo_invalido: 'Código de autorização inválido.',
        falha_token: 'Falha ao validar sua conta. Tente novamente.',
        auth_failed: 'Erro na autenticação. Tente novamente.',
        erro_servidor: 'Erro interno. Tente novamente.',
      };
      errorDiv.textContent = messages[error] || 'Erro desconhecido.';
      errorDiv.style.display = 'block';
    }
  </script>
</body>
</html>
